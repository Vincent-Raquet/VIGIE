---
# Base de production « vigie » à côté des bases de dev (vigie_dev, vigie_test).
# Aucun mot de passe : authentification peer sur le socket unix, comptes système mappés.
- name: PostgreSQL 17
  ansible.builtin.apt:
    name: [postgresql-17]
    state: present

- name: Rôles applicatifs (LOGIN, sans mot de passe)
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  community.postgresql.postgresql_user:
    name: "{{ item }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOINHERIT
  loop: [vigie_migrate, vigie_web, vigie_worker]
  become: true
  become_user: postgres

- name: Base vigie
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  block:
    - name: Base vigie, propriété de vigie_migrate (jamais d'un rôle d'exécution)
      community.postgresql.postgresql_db: &vigie_db
        name: vigie
        owner: vigie_migrate
        encoding: UTF8
        lc_collate: fr_BE.UTF-8
        lc_ctype: fr_BE.UTF-8
        template: template0
      become: true
      become_user: postgres
  rescue:
    # Locale générée après le démarrage de PostgreSQL (rôle base) : invisible tant que le
    # serveur n'a pas redémarré.
    - name: Redémarrage de PostgreSQL pour la locale fr_BE.UTF-8
      ansible.builtin.systemd_service:
        name: postgresql
        state: restarted
    - name: Base vigie, seconde tentative
      community.postgresql.postgresql_db: *vigie_db
      become: true
      become_user: postgres

- name: Connexion à la base pour les rôles d'exécution
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  community.postgresql.postgresql_privs:
    login_db: vigie
    type: database
    privs: CONNECT
    roles: vigie_web,vigie_worker
  become: true
  become_user: postgres

- name: Aucun accès par défaut à la base pour PUBLIC
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  community.postgresql.postgresql_privs:
    login_db: vigie
    type: database
    privs: CONNECT,TEMPORARY
    roles: PUBLIC
    state: absent
  become: true
  become_user: postgres

- name: Correspondance comptes système → rôles (pg_ident)
  ansible.builtin.blockinfile:
    path: /etc/postgresql/17/main/pg_ident.conf
    marker: "# {mark} VIGIE"
    block: |
      vigie   vigie-web       vigie_web
      vigie   vigie-worker    vigie_worker
      vigie   vigie-migrate   vigie_migrate
  notify: Recharger PostgreSQL

- name: Accès à la base vigie, socket unix seulement, avant les règles générales
  ansible.builtin.blockinfile:
    path: /etc/postgresql/17/main/pg_hba.conf
    marker: "# {mark} VIGIE"
    insertbefore: '^local\s+all\s+all\s+peer'
    block: |
      local   vigie   vigie_web,vigie_worker,vigie_migrate   peer map=vigie
      local   vigie   postgres                                peer
      local   vigie   all                                     reject
      host    vigie   all             all                     reject
  notify: Recharger PostgreSQL

- name: PostgreSQL n'écoute que localement
  ansible.builtin.lineinfile:
    path: /etc/postgresql/17/main/postgresql.conf
    regexp: '^#?listen_addresses'
    line: "listen_addresses = 'localhost'"
  notify: Redémarrer PostgreSQL
