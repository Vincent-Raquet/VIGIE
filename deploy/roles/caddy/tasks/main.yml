---
- name: Caddy
  ansible.builtin.apt:
    name: [caddy]
    state: present

- name: Caddyfile
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: caddy validate --adapter caddyfile --config %s
  notify: Recharger Caddy

- name: Journal d'accès de Caddy
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  ansible.builtin.file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: "0750"

- name: Caddy actif
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started

- name: Racine de l'AC interne de Caddy (créée au premier certificat)
  ansible.builtin.stat:
    path: /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt
  register: caddy_root

- name: Copie de la racine à déployer par GPO sur les postes
  ansible.builtin.copy:
    src: /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt
    dest: /etc/vigie/caddy-root-ca.crt
    remote_src: true
    mode: "0644"
  when: caddy_root.stat.exists
