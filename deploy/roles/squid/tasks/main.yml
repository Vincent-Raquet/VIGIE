---
- name: Squid
  ansible.builtin.apt:
    name: [squid]
    state: present

- name: Configuration Squid (deux ports, deux allowlists de domaines)
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    mode: "0644"
    validate: /usr/sbin/squid -k parse -f %s
  notify: Redémarrer Squid

- name: Squid actif
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  ansible.builtin.systemd_service:
    name: squid
    enabled: true
    state: started
