---
- name: Recharger systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Redémarrer vigie-web
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  ansible.builtin.systemd_service:
    name: vigie-web.service
    state: restarted
  when: vigie_secrets_ok | default(false)

- name: Redémarrer vigie-chat
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  ansible.builtin.systemd_service:
    name: vigie-chat.service
    state: restarted
  when: (vigie_secrets_ok | default(false)) and (vigie_llm_enabled | bool)
