---
- name: Recharger systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Configuration lue au démarrage (vigie.toml, squid.conf) : redémarrage des conteneurs.
- name: Redémarrer les services permanents
  community.docker.docker_compose_v2:
    project_src: "{{ vigie_compose_dir }}"
    services: "{{ vigie_permanent_services }}"
    state: restarted
  when: (vigie_secrets_ok | default(false)) and not ansible_check_mode

# Redémarre aussi vigie-compose (Requires=) : les conteneurs relisent les nouveaux fichiers.
- name: Redéchiffrer les secrets
  ansible.builtin.systemd_service:
    name: vigie-creds.service
    state: restarted
  when: (vigie_secrets_ok | default(false)) and not ansible_check_mode
