---
# Application Vigie en conteneurs : images, configuration, compose, migrations, unités et
# timers (SECURITY.md C6–C8). Le moteur Docker vient du rôle docker, le proxy d'entrée du
# rôle edge.
- name: Groupe vigie (lecture de /etc/vigie)
  ansible.builtin.group:
    name: vigie
    system: true

# Comptes sans shell ni dossier : leurs UID sont ceux des conteneurs, que PostgreSQL
# reconnaît par l'authentification peer (pg_ident, rôle postgresql).
- name: Comptes de service
  ansible.builtin.user:
    name: "{{ item }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /nonexistent
    groups: [vigie]
    append: true
  loop: [vigie-web, vigie-worker, vigie-migrate]

- name: UID des comptes de service
  ansible.builtin.getent:
    database: passwd
  check_mode: false

- name: GID du groupe vigie
  ansible.builtin.getent:
    database: group
    key: vigie
  check_mode: false

- name: Identités des conteneurs
  ansible.builtin.set_fact:
    vigie_ids:
      web: "{{ ansible_facts.getent_passwd['vigie-web'][1] }}"
      worker: "{{ ansible_facts.getent_passwd['vigie-worker'][1] }}"
      migrate: "{{ ansible_facts.getent_passwd['vigie-migrate'][1] }}"
      group: "{{ ansible_facts.getent_group['vigie'][1] }}"

- name: Script de dépôt des secrets
  ansible.builtin.copy:
    src: vigie-secret
    dest: /usr/local/sbin/vigie-secret
    mode: "0750"

- name: Magasin des secrets chiffrés
  ansible.builtin.file:
    path: /etc/credstore.encrypted
    state: directory
    mode: "0700"

# --- Secrets : présence seulement (jamais lus ni affichés) ------------------------------
- name: Secrets déposés
  ansible.builtin.stat:
    path: /etc/credstore.encrypted/vigie.{{ item }}
    get_checksum: false
  loop: "{{ vigie_required_secrets }}"
  register: vigie_secret_files

- name: Secrets manquants
  ansible.builtin.set_fact:
    vigie_missing_secrets: >-
      {{ vigie_secret_files.results | rejectattr('stat.exists') | map(attribute='item') | list }}

- name: État des secrets
  ansible.builtin.set_fact:
    vigie_secrets_ok: "{{ vigie_missing_secrets | length == 0 }}"

- name: Secrets à déposer avant activation
  ansible.builtin.debug:
    msg: >-
      Secrets manquants : {{ vigie_missing_secrets | join(', ') }}.
      Déposez-les (`sudo vigie-secret set <nom>`, valeur sur l'entrée standard) puis relancez
      le playbook : les unités ne sont activées qu'une fois tous les secrets présents.
  when: not vigie_secrets_ok

- name: Dossiers de Vigie
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/vigie, group: vigie, mode: "0750"}
    - {path: /etc/vigie/seed, group: vigie, mode: "0750"}
    - {path: /etc/vigie/seed/roles, group: vigie, mode: "0750"}
    - {path: "{{ vigie_compose_dir }}", group: root, mode: "0750"}
    - {path: "{{ vigie_compose_dir }}/build", group: root, mode: "0750"}
    - {path: "{{ vigie_compose_dir }}/build/squid", group: root, mode: "0750"}
    - {path: /var/lib/vigie, group: root, mode: "0755"}
    - {path: /var/lib/vigie/selfcheck, owner: vigie-worker, group: vigie-worker, mode: "0755"}

- name: Configuration non secrète
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/vigie/{{ item }}
    owner: root
    group: vigie
    mode: "0640"
  loop: [vigie.toml, migrate.toml]
  notify: Redémarrer les services permanents

# --- Images (deploy/build.sh) ------------------------------------------------------------
# Contexte de l'image de Vigie : le wheel et les dépendances figées (empreintes) de dist/,
# jamais le dépôt (ni .env.local ni config réelle).
- name: Contexte de construction de {{ vigie_image }}
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ vigie_compose_dir }}/build/{{ vigie_release }}/"
    mode: "0640"
  diff: false  # requirements.txt : un millier de lignes d'empreintes
  with_fileglob:
    - "{{ vigie_dist_dir }}/*.whl"
    - "{{ vigie_dist_dir }}/requirements.txt"
    - "{{ playbook_dir }}/docker/vigie/Dockerfile"

- name: Image {{ vigie_image }}
  community.docker.docker_image_build:
    name: vigie
    tag: "{{ vigie_release }}"
    path: "{{ vigie_compose_dir }}/build/{{ vigie_release }}"
    pull: true
    args:
      VIGIE_RELEASE: "{{ vigie_release }}"
  when: not ansible_check_mode  # simulation : contexte de construction non copié

- name: Contexte de l'image Squid
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/docker/squid/Dockerfile"
    dest: "{{ vigie_compose_dir }}/build/squid/Dockerfile"
    mode: "0640"

# Reconstruite chaque mois (étiquette AAAAMM) : paquets Debian à jour.
- name: Image {{ vigie_squid_image }}
  community.docker.docker_image_build:
    name: "{{ vigie_squid_image.split(':')[0] }}"
    tag: "{{ vigie_squid_image.split(':')[1] }}"
    path: "{{ vigie_compose_dir }}/build/squid"
    pull: true
  when: not ansible_check_mode  # simulation : contexte de construction non copié

# --- Projet compose ----------------------------------------------------------------------
- name: Configuration de Squid
  ansible.builtin.template:
    src: squid.conf.j2
    dest: "{{ vigie_compose_dir }}/squid.conf"
    owner: root
    group: root
    mode: "0644"  # lu par le compte proxy du conteneur
  notify: Redémarrer les services permanents

- name: Fichier compose
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ vigie_compose_dir }}/compose.yaml"
    mode: "0640"
    validate: docker compose --file %s config --quiet --no-interpolate

- name: Site de Vigie sur le proxy d'entrée
  ansible.builtin.template:
    src: vigie.caddy.j2
    dest: "{{ edge_dir }}/sites/vigie.caddy"
    mode: "0644"
  notify: Redémarrer Caddy

# --- Certificats propres aux sources (auto-signés) ------------------------------------
- name: Dossier des certificats des sources
  ansible.builtin.file:
    path: /etc/vigie/ca
    state: directory
    owner: root
    group: vigie
    mode: "0750"

- name: Certificat du serveur Veeam (public, approuvé pour cette seule source)
  ansible.builtin.copy:
    src: "{{ vigie_veeam_ca_file }}"
    dest: /etc/vigie/ca/veeam.pem
    owner: root
    group: vigie
    mode: "0644"
  when: vigie_veeam_host | length > 0

- name: Certificat d'usine du FortiAnalyzer (public, approuvé pour cette seule source)
  ansible.builtin.copy:
    src: "{{ vigie_fortianalyzer_ca_file }}"
    dest: /etc/vigie/ca/fortianalyzer.pem
    owner: root
    group: vigie
    mode: "0644"
  when: vigie_fortianalyzer_enabled | bool

- name: Certificats épinglés de Wazuh (API et AC de l'indexer, publics, pour cette seule source)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/etc/vigie/ca/{{ item.dest }}"
    owner: root
    group: vigie
    mode: "0644"
  loop:
    - {src: "{{ vigie_wazuh_api_ca_file }}", dest: wazuh-api.pem}
    - {src: "{{ vigie_wazuh_indexer_ca_file }}", dest: wazuh-indexer.pem}
  loop_control:
    label: "{{ item.dest }}"
  when: vigie_wazuh_enabled | bool

# Le nom du FortiAnalyzer est déclaré dans les conteneurs (extra_hosts de compose.yaml).
- name: Ancienne déclaration du FortiAnalyzer dans /etc/hosts de l'hôte
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ vigie_fortianalyzer_name }}$'
    state: absent

- name: Certificat public de l'application « Vigie Defender » (la clé reste dans vigie-secret)
  ansible.builtin.copy:
    src: "{{ vigie_defender_cert_file }}"
    dest: /etc/vigie/ca/defender.crt
    owner: root
    group: vigie
    mode: "0644"
  when: vigie_defender_enabled | bool

# --- Données d'amorçage et migrations ---------------------------------------------------
- name: Fichiers d'amorçage (équipe, sociétés, politique, scoring)
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/vigie/seed/
    owner: root
    group: vigie
    mode: "0640"
  with_fileglob:
    - "{{ playbook_dir }}/../config/*.yaml"

- name: Skills de rôle
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  ansible.builtin.copy:
    src: "{{ vigie_roles_dir }}/"
    dest: /etc/vigie/seed/roles/
    owner: root
    group: vigie
    directory_mode: "0750"
    mode: "0640"

# --- Unités et timers -------------------------------------------------------------------
- name: Déchiffrement des secrets pour les conteneurs
  ansible.builtin.template:
    src: vigie-creds-unlock.j2
    dest: /usr/local/sbin/vigie-creds-unlock
    mode: "0750"
  notify: Redéchiffrer les secrets

- name: Unités des secrets et des services permanents
  ansible.builtin.template:
    src: units/{{ item }}.j2
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop: [vigie-creds.service, vigie-compose.service]
  notify: Recharger systemd

- name: Tâches ponctuelles
  ansible.builtin.template:
    src: units/vigie-task.service.j2
    dest: /etc/systemd/system/{{ item.name }}
    mode: "0644"
  loop: "{{ vigie_tasks }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    task: "{{ item }}"
  notify: Recharger systemd

- name: Timers de collecte
  ansible.builtin.template:
    src: units/timer.j2
    dest: /etc/systemd/system/vigie-collect@{{ item.name }}.timer
    mode: "0644"
  loop: "{{ vigie_sources_enabled }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    timer_unit: vigie-collect@{{ item.name }}.service
    timer_every: "{{ item.interval_min }}min"
    timer_jitter: 1min
  notify: Recharger systemd

- name: Autres timers
  ansible.builtin.template:
    src: units/timer.j2
    dest: /etc/systemd/system/{{ item.name }}
    mode: "0644"
  loop: "{{ vigie_timers }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    timer_unit: "{{ item.timer_unit }}"
    timer_calendar: "{{ item.timer_calendar | default('') }}"
    timer_every: "{{ item.timer_every | default('') }}"
    timer_jitter: "{{ item.timer_jitter | default('0') }}"
  notify: Recharger systemd

- name: Prise en compte des unités
  ansible.builtin.meta: flush_handlers

- name: Secrets déchiffrés pour les conteneurs
  ansible.builtin.systemd_service:
    name: vigie-creds.service
    enabled: true
    state: started
  when: vigie_secrets_ok

- name: Migrations de la base (vigie-migrate, propriétaire du schéma, sans réseau)
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ vigie_compose_dir }} run --rm --no-TTY migrate
  register: vigie_migrate
  changed_when: "'Base migrée' in vigie_migrate.stdout"

- name: Amorçage initial (vigie_run_seed)
  ansible.builtin.command:
    cmd: >-
      docker compose --project-directory {{ vigie_compose_dir }} run --rm --no-TTY migrate
      seed --from /etc/vigie/seed --roles /etc/vigie/seed/roles
  when: vigie_run_seed | bool
  changed_when: true

# Recrée les conteneurs dont l'image ou la définition a changé (nouvelle version).
- name: Services permanents à jour
  community.docker.docker_compose_v2:
    project_src: "{{ vigie_compose_dir }}"
    services: "{{ vigie_permanent_services }}"
    state: present
    pull: never
    remove_orphans: true
  when: vigie_secrets_ok and not ansible_check_mode

- name: Discussion avec l'IA arrêtée (IA désactivée)
  community.docker.docker_compose_v2:
    project_src: "{{ vigie_compose_dir }}"
    services: [chat]
    state: stopped
  when: vigie_secrets_ok and not vigie_llm_enabled | bool and not ansible_check_mode

# Démarrée (oneshot, RemainAfterExit) : son arrêt, à l'extinction, arrête proprement les
# conteneurs ; son démarrage refait `up`, sans effet sur des conteneurs déjà à jour.
- name: Services permanents au démarrage de la machine
  ansible.builtin.systemd_service:
    name: vigie-compose.service
    enabled: true
    state: started
  when: vigie_secrets_ok

- name: Timers de collecte actifs
  ansible.builtin.systemd_service:
    name: vigie-collect@{{ item.name }}.timer
    enabled: true
    state: started
  loop: "{{ vigie_sources_enabled }}"
  loop_control:
    label: "{{ item.name }}"
  when: vigie_secrets_ok

- name: Autres timers (actifs ou arrêtés selon la configuration)
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    enabled: "{{ item.enabled | bool }}"
    state: "{{ 'started' if item.enabled | bool else 'stopped' }}"
  loop: "{{ vigie_timers }}"
  loop_control:
    label: "{{ item.name }}"
  when: vigie_secrets_ok

# --- Anciennes versions -----------------------------------------------------------------
- name: Images de Vigie présentes
  ansible.builtin.command:
    cmd: docker image ls vigie --format {% raw %}'{{.CreatedAt}} {{.Tag}}'{% endraw %}
  register: vigie_images
  changed_when: false
  check_mode: false

- name: Suppression des images les plus anciennes (la courante est toujours gardée)
  ansible.builtin.command:
    cmd: docker image rm vigie:{{ item }}
  loop: >-
    {{ (vigie_images.stdout_lines | sort | reverse | map('split', ' ') | map('last')
        | reject('equalto', vigie_release) | list)[vigie_keep_images - 1:] }}
  changed_when: true
