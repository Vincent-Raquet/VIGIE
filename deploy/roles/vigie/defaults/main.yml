---
# Projet compose de Vigie (compose.yaml, squid.conf, contextes de construction des images).
vigie_compose_dir: /srv/vigie
vigie_image: "vigie:{{ vigie_release }}"
# Image Squid reconstruite (apt à jour) au premier passage de chaque mois.
vigie_squid_image: "vigie-squid:{{ '%Y%m' | strftime }}"
vigie_keep_images: 3

# Horaires (heure locale de la VM, Europe/Brussels) — SPEC §8.
vigie_schedule:
  plan_daily: "Mon..Fri *-*-* 07:15:00"
  plan_weekly: "Mon *-*-* 06:30:00"
  notify_daily: "Mon..Fri *-*-* 07:30:00"
  notify_weekly: "Mon *-*-* 09:00:00"
  housekeeping: "*-*-* 02:30:00"
