---
- name: Paquets de durcissement
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
      - apparmor
      - apparmor-utils
      - sshguard
      - acct                  # comptabilité des processus
      - sysstat
      - debsums
      - apt-show-versions
      - needrestart
      - libpam-tmpdir
      - libpam-passwdqc
      - rkhunter              # en attendant l'agent Wazuh (FIM, détection)
    state: present

- name: Paramètres noyau
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-vigie.conf
    reload: true
  loop: "{{ hardening_sysctl | dict2items }}"

- name: Modules noyau inutiles désactivés
  ansible.builtin.copy:
    dest: /etc/modprobe.d/vigie-blacklist.conf
    content: |
      # Géré par Ansible (deploy/roles/hardening)
      {% for m in hardening_blacklisted_modules %}
      install {{ m }} /bin/false
      blacklist {{ m }}
      {% endfor %}
    mode: "0644"

- name: Politique de mots de passe et umask par défaut (login.defs)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?{{ item.key }}\s'
    line: "{{ item.key }}\t{{ item.value }}"
  loop: "{{ hardening_login_defs | dict2items }}"

- name: Mode liste pour needrestart (aucun redémarrage de service sans décision)
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/vigie.conf
    content: |
      # Géré par Ansible (deploy/roles/hardening)
      $nrconf{restart} = 'l';
    mode: "0644"

- name: Collecte sysstat activée
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
  notify: Redémarrer sysstat

- name: Bannière légale (console et SSH)
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: |
      Système privé de WallIndustries. Accès réservé aux personnes autorisées ;
      les connexions et actions sont journalisées.
    mode: "0644"
  loop: [/etc/issue, /etc/issue.net]

- name: Paquet remplacé encore configuré (systemd-timesyncd, remplacé par chrony)
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: absent
    purge: true

# auditctl refuse de surveiller un chemin absent et s'arrête au premier refus (règles
# suivantes non chargées) : les dossiers surveillés existent avant les règles. Mêmes
# propriétaires et droits que dans les rôles edge et vigie (idempotence).
- name: Dossiers surveillés par auditd
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /srv/vigie, mode: "0750"}
    - {path: /srv/edge, mode: "0755"}
    - {path: /etc/docker, mode: "0755"}

- name: Règles auditd de Vigie
  ansible.builtin.copy:
    src: vigie.rules
    dest: /etc/audit/rules.d/vigie.rules
    mode: "0640"
  notify: Recharger auditd

- name: Services auditd, AppArmor et sshguard actifs
  ignore_errors: "{{ ansible_check_mode }}"  # simulation : paquet ou compte pas encore créé
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [auditd, apparmor, sshguard, acct, sysstat]

- name: "SSH durci (prudent : aucune méthode d'authentification retirée sans variable)"
  ansible.builtin.template:
    src: sshd-vigie.conf.j2
    dest: /etc/ssh/sshd_config.d/50-vigie.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Recharger sshd

# --- Traitement invité Veeam (SSH depuis le serveur VBR) --------------------------------
- name: Serveur Veeam exempté de sshguard (ses reprises ne doivent pas le bannir)
  ansible.builtin.lineinfile:
    path: /etc/sshguard/whitelist
    line: "{{ item }}"
    create: true
    mode: "0644"
  loop: "{{ veeam_guest_sources | default([]) }}"
  notify: Redémarrer sshguard

- name: Compte du traitement invité Veeam (mot de passe déposé à la main, jamais par Ansible)
  ansible.builtin.user:
    name: "{{ veeam_guest_user }}"
    comment: Veeam traitement invite
    shell: /bin/bash
    password: "!"
    update_password: on_create
    create_home: true
  when: veeam_guest_enabled | bool

- name: Clé SSH du compte Veeam, utilisable seulement depuis le serveur Veeam
  ansible.posix.authorized_key:
    user: "{{ veeam_guest_user }}"
    key: "{{ veeam_guest_pubkey }}"
    key_options: >-
      from="{{ veeam_guest_sources | join(',') }}",no-port-forwarding,no-agent-forwarding,no-X11-forwarding
    exclusive: true
  when: veeam_guest_enabled | bool and veeam_guest_auth == "key" and veeam_guest_pubkey | length > 0

- name: Sudo du compte Veeam (exigé pour le traitement invité ; tracé par auditd)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/50-veeam-guest
    content: |
      # Veeam B&R : traitement invité de cette VM (composant déposé et exécuté par SSH).
      Defaults:{{ veeam_guest_user }} !requiretty
      {{ veeam_guest_user }} ALL=(root) NOPASSWD: ALL
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: veeam_guest_enabled | bool

- name: Compte Veeam sans sudo quand il est désactivé
  ansible.builtin.file:
    path: /etc/sudoers.d/50-veeam-guest
    state: absent
  when: not (veeam_guest_enabled | bool)
