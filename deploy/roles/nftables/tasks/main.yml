---
- name: Réseaux bien formés (une erreur ici peut couper l'accès SSH)
  ansible.builtin.assert:
    that: >-
      (admin_networks + lan_vpn_networks + dns_servers + [zabbix_server]
       + (vigie_source_egress | map(attribute='ip') | list))
      | reject('match', '^([0-9]{1,3}\\.){3}[0-9]{1,3}(/[0-9]{1,2})?$') | list | length == 0
    fail_msg: >-
      Adresse ou réseau mal formé dans group_vars/vigie.yml (un élément de liste par ligne,
      avec son tiret) : {{ (admin_networks + lan_vpn_networks + dns_servers)
      | reject('match', '^([0-9]{1,3}\\.){3}[0-9]{1,3}(/[0-9]{1,2})?$') | list }}
    quiet: true

- name: Paquet nftables
  ansible.builtin.apt:
    name: [nftables]
    state: present

- name: Comptes système filtrés (les règles skuid exigent qu'ils existent)
  ansible.builtin.user:
    name: "{{ item }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /nonexistent
  loop: [vigie-web, vigie-worker, vigie-migrate]

- name: Règles nftables
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0600"
    validate: /usr/sbin/nft -c -f %s
  notify: Recharger nftables

- name: Service nftables actif au démarrage
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
