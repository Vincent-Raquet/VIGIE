---
- name: Réseaux bien formés (une erreur ici peut couper l'accès SSH)
  ansible.builtin.assert:
    that: >-
      (admin_networks + lan_vpn_networks + dns_servers + [zabbix_server]
       + (vigie_source_egress | map(attribute='ip') | list)
       + (vigie_source_egress | map(attribute='subnet') | list)
       + (vigie_networks.values() | map(attribute='subnet') | list)
       + [vigie_jobs_subnet, edge_subnet, vigie_web_edge_ip, edge_caddy_ip]
       + (veeam_guest_sources | default([])))
      | reject('match', '^([0-9]{1,3}\\.){3}[0-9]{1,3}(/[0-9]{1,2})?$') | list | length == 0
    fail_msg: >-
      Adresse ou réseau mal formé dans group_vars/vigie.yml (un élément de liste par ligne,
      avec son tiret) : {{ (admin_networks + lan_vpn_networks + dns_servers)
      | reject('match', '^([0-9]{1,3}\\.){3}[0-9]{1,3}(/[0-9]{1,2})?$') | list }}
    quiet: true

- name: Paquet nftables
  ansible.builtin.apt:
    name: [nftables]
    state: present

# nftables.service vide tout le jeu de règles à l'arrêt (« flush ruleset ») : il effacerait
# celles de Docker. Seule la table de Vigie est retirée.
- name: Dossier de compléments de nftables.service
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: "0755"

- name: Arrêt de nftables sans toucher aux tables de Docker
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/vigie.conf
    content: |
      # Géré par Ansible (rôle nftables) : modifications manuelles écrasées.
      [Service]
      ExecStop=
      ExecStop=-/usr/sbin/nft delete table inet vigie
    mode: "0644"
  notify: Recharger systemd (nftables)

- name: Règles nftables
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0600"
    validate: /usr/sbin/nft -c -f %s
  notify: Recharger nftables

- name: Service nftables actif au démarrage
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
