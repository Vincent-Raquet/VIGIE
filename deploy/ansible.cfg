[defaults]
inventory = inventory/hosts.yml
roles_path = roles
stdout_callback = default
callback_result_format = yaml
interpreter_python = /usr/bin/python3
retry_files_enabled = False
nocows = True
# Un passage interrompu exécute quand même les rechargements en attente (Squid, sshd…).
force_handlers = True
# Journal de chaque passage (sortie et diffs) lu par Claude Code au lieu d'un copier-coller.
# Hors dépôt, dossier 0700 ; aucun secret n'est rendu par les rôles (valeurs jamais lues).
log_path = ~/.local/state/vigie/ansible.log

[privilege_escalation]
become = True
become_method = sudo
