# Variables NON secrètes. Les secrets se déposent sur la VM avec `vigie-secret set <nom>`.

# --- Cohabitation avec le développement -------------------------------------------------
# true : le filtrage sortant ne vise que les comptes vigie-* (nadmin et Claude Code gardent
# leur accès). Passer à false le jour où le développement quitte la VM : sortie en drop.
vigie_dev_on_host: true

# --- Réseau ------------------------------------------------------------------------------
vigie_domain: vigie.local.wallindustries.be
vigie_ip: 192.168.10.17
# SSH : À RELIRE avant le premier passage (une erreur ici coupe votre accès).
# 192.168.48.11 = poste d'où la session de développement est ouverte (2026-10-09).
admin_networks:
  - 192.168.48.11/32
  - 192.168.10.0/24
  - 192.168.250.0/24
# HTTPS de Vigie : LAN et pool VPN (à compléter avec le pool VPN).
lan_vpn_networks:
  - 192.168.0.0/16
dns_servers:
  - 192.168.250.10
  - 192.168.250.14
ntp_servers: []                 # vide : pool Debian par défaut (via la sortie autorisée)
zabbix_server: 192.168.250.49

# Sorties directes du worker vers les sources internes (le reste passe par Squid).
vigie_source_egress:
  - {name: zabbix, ip: 192.168.250.49, port: 443}
  - {name: veeam, ip: 10.10.10.27, port: 9419}      # API REST du VBR (pare-feu Windows : 9419 depuis vigie_ip)

# --- Squid (sortie Internet) -------------------------------------------------------------
squid_worker_port: 3128         # vigie-worker : IA, Graph, Teams
squid_web_port: 3129            # vigie-web : connexion Entra seulement
squid_worker_domains:
  - api.anthropic.com
  - login.microsoftonline.com
  - graph.microsoft.com
  - eu.ninjarmm.com             # API NinjaOne (jeton et lectures)
  - eu.api.security.microsoft.com   # API Defender for Endpoint, région UE (jeton : login, incidents : graph)
squid_teams_domains: []         # ex. .westeurope.logic.azure.com quand Teams sera activé
squid_web_domains:
  - login.microsoftonline.com

# --- Application ------------------------------------------------------------------------
vigie_release: "{{ lookup('file', playbook_dir + '/../dist/release.txt') }}"
vigie_dist_dir: "{{ playbook_dir }}/../dist"
vigie_roles_dir: "{{ playbook_dir }}/../roles"
vigie_web_port: 8080
# Veeam B&R 13.1 : nom ou IP porté par le certificat du VBR. Le certificat auto-signé de
# WI-VEEAM-SA-01 contient l'IP 10.10.10.27 (SAN, vérifié le 2026-10-11) : mettre "10.10.10.27".
# Vide = source Veeam non déployée.
vigie_veeam_host: "10.10.10.27"
# Certificat (auto-signé) du VBR, exporté depuis le serveur, sur la machine qui lance Ansible
# (hors dépôt) ; copié dans /etc/vigie/ca/veeam.pem. Seul ce certificat est approuvé pour Veeam.
vigie_veeam_ca_file: "~/vigie-ca/veeam.pem"

vigie_sources_base:
  - name: zabbix
    interval_min: 15
    secrets: [zabbix_api_token]
    settings:
      base_url: "https://zabbix.local.wallindustries.be/zabbix"
      min_severity: 2
vigie_source_veeam:
  - name: veeam
    interval_min: 30
    secrets: [veeam_password]
    settings:
      base_url: "https://{{ vigie_veeam_host }}:9419"
      username: svcveeamvigie
      api_version: "1.3-rev2"   # VBR 13.1.1.18 (2026-10-11) ; 1.3-rev1 pour 13.0.1
      ca_bundle: /etc/vigie/ca/veeam.pem
# NinjaOne (eu.ninjarmm.com, via Squid). Client id et secret de l'app API « Vigie » : secrets
# ninjaone_client_id et ninjaone_client_secret (vigie-secret ; le client id ressemble à une
# clé, gitleaks le refuse dans le dépôt). false = source NinjaOne non déployée.
vigie_ninjaone_enabled: true
vigie_ninjaone_board_id: 4          # « Tickets ouverts » (0 = pas de tickets)
vigie_ninjaone_statuses: [Nouveau, Ouvert, En attente]   # noms affichés dans NinjaOne
vigie_source_ninjaone:
  - name: ninjaone
    interval_min: 15
    secrets: [ninjaone_client_id, ninjaone_client_secret]
    settings:
      base_url: "https://eu.ninjarmm.com"
      scope: monitoring
      ticket_board_id: "{{ vigie_ninjaone_board_id | int }}"
      ticket_statuses: "{{ vigie_ninjaone_statuses }}"
      proxy: "http://127.0.0.1:{{ squid_worker_port }}"
# Microsoft Defender (app Entra « Vigie Defender », même tenant que la connexion : vigie_oidc).
# Authentification par certificat, sans secret client. Le même certificat sert en dev et en
# prod : le public (~/vigie-ca/defender.crt, poste qui lance Ansible) est copié dans
# /etc/vigie/ca/defender.crt ; la clé privée est le secret defender_private_key
# (`sudo vigie-secret set defender_private_key < defender.key`, jamais copiée par Ansible).
# false = source Defender non déployée.
vigie_defender_enabled: true          # client id : secret defender_client_id (gitleaks refuse le GUID)
vigie_defender_cert_file: "~/vigie-ca/defender.crt"
vigie_defender_api_host: eu.api.security.microsoft.com
vigie_source_defender:
  - name: defender
    interval_min: 60
    secrets: [defender_client_id, defender_private_key]
    settings:
      tenant_id: "{{ vigie_oidc.tenant_id }}"
      api_host: "{{ vigie_defender_api_host }}"
      certificate: /etc/vigie/ca/defender.crt
      os_platform_prefixes: [Windows]   # Linux → Wazuh, patchs manquants → NinjaOne
      inactive_days: 14
      max_vulns_per_company: 10
      proxy: "http://127.0.0.1:{{ squid_worker_port }}"
vigie_sources_enabled: >-
  {{ vigie_sources_base
     + (vigie_source_veeam if vigie_veeam_host else [])
     + (vigie_source_ninjaone if vigie_ninjaone_enabled else [])
     + (vigie_source_defender if vigie_defender_enabled else []) }}
vigie_llm_enabled: true
vigie_llm_budget_usd: 30
vigie_notify_mail_enabled: false
vigie_notify_teams_enabled: false
# Rodage (phase 9) : true = tout part au coordinateur. false seulement une fois le critère
# de la page Rodage atteint (deploy/README.md, « Fin de rodage »).
vigie_notify_draft_only: true
vigie_oidc:
  tenant_id: "6f5991ec-d614-41e6-92a6-dd77a108b727"                 # à reprendre de config/vigie.toml (non secret)
  client_id: "5cd2e503-e88b-4a02-b23e-36e1e487fffd"   # gitleaks:allow (identifiant public d'app Entra, non secret)
  groups:
    "751fe482-0213-4440-ac04-3f3e0daef900": admin
    "3e3a7eb9-298d-418b-84cd-f6b1e508d8f0": manager
    "5898ac98-7eba-4df8-b575-4477f68ea045": tech
    "8d4efea4-3944-4f37-985c-237bd3166c2d": viewer
vigie_run_seed: false           # true au premier déploiement (fichiers dans /etc/vigie/seed)

# --- Supervision et sauvegarde -----------------------------------------------------------
zabbix_agent_hostname: WI-SRV-VIGIE-01
zabbix_agent_psk_identity: vigie-01
# Clé PUBLIQUE age des sauvegardes (la clé privée reste hors VM) : `age-keygen -o vigie.key`.
backup_age_recipient: "age19ws8qk2j62hshnygfgkpsevluaytpy0umgya4drnxt0d9zs7dgqstm3aq8"
backup_retention_days: 14

# --- Durcissement -----------------------------------------------------------------------
# Ne désactive l'authentification SSH par mot de passe que si vous le demandez explicitement
# (vérifiez d'abord que votre clé fonctionne).
ssh_disable_password_auth: false
