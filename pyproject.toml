[project]
name = "vigie"
version = "0.1.0"
description = "Veille des systèmes de supervision IT et planification des tâches de l'équipe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.scripts]
vigie = "vigie.cli:app"

# Connecteurs découverts par vigie.connectors.registry (SPEC §6.1).
# Ajouter un système = un module + une ligne ici (skill add-connector), sans toucher au moteur.
[project.entry-points."vigie.connectors"]
zabbix = "vigie.connectors.zabbix:ZabbixConnector"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigie"]

# --- Qualité -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Les blocs de code des docs sont illustratifs, pas du code du projet.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "SIM", "PTH", "RUF", "TID"]

[tool.ruff.lint.per-file-ignores]
# Les tests simulent le réseau (transports httpx factices, socket bloqué).
"tests/**" = ["S101", "S105", "S106", "TID251"]
# Seul SafeClient a le droit de parler au réseau (CLAUDE.md règle 1).
"src/vigie/connectors/base.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Accès réseau : passer par vigie.connectors.base.SafeClient (CLAUDE.md règle 1)."
"requests".msg = "Accès réseau : passer par vigie.connectors.base.SafeClient (CLAUDE.md règle 1)."
"aiohttp".msg = "Accès réseau : passer par vigie.connectors.base.SafeClient (CLAUDE.md règle 1)."
"urllib.request".msg = "Accès réseau : passer par vigie.connectors.base.SafeClient (CLAUDE.md règle 1)."
"socket".msg = "Accès réseau brut interdit (SECURITY.md C2)."
"subprocess".msg = "Exécution de commandes interdite dans src/ (SECURITY.md C10)."
"pickle".msg = "Désérialisation non sûre interdite (SECURITY.md C10)."
"os.system".msg = "Exécution de commandes interdite dans src/ (SECURITY.md C10)."

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    # Aucun test ne sort sur le réseau (CLAUDE.md) ; sockets unix autorisés pour PostgreSQL local.
    "--disable-socket",
    "--allow-unix-socket",
    "--cov=vigie",
    "--cov-report=term-missing",
]
markers = ["db: nécessite la base PostgreSQL locale vigie_test"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
