# /etc/vigie/vigie.toml — configuration NON secrète. Les secrets passent par systemd-creds (docs/SECURITY.md C7).
[general]
timezone = "Europe/Brussels"
base_url = "https://vigie.local.wallindustries.be"
holidays_country = "BE"
paused = false

[database]
# Socket unix + authentification peer (aucun mot de passe). Dev : postgresql+psycopg:///vigie_dev
url = "postgresql+psycopg:///vigie"

[llm]
enabled = true
model = "claude-sonnet-5-5"
max_tokens_daily = 8000
max_tokens_weekly = 16000
monthly_budget_usd = 30
send_ticket_text = false
effort = "medium"      # low | medium | high : profondeur de réflexion et coût
fallback = true        # repli serveur si le modèle refuse pour raison de sécurité
timeout_s = 120
# Clé : secret « anthropic_api_key » (systemd-creds en prod, VIGIE_SECRET_ANTHROPIC_API_KEY dans .env.local en dev)

[chat]                 # discussion avec l'IA (plan du jour, fiche incident) ; même clé et budget que [llm]
enabled = true
effort = "low"
max_output_tokens = 2000          # par réponse
max_question_chars = 2000
max_conversation_tokens = 250000  # au-delà : « Réinitialiser le contexte »
max_user_daily_tokens = 400000    # par utilisateur et par jour (UTC)
history_messages = 20
poll_interval_s = 2               # service vigie-chat : délai entre deux lectures de la file

[plans]
daily_at = "07:15"
daily_publish_at = "07:30"
weekly_day = "mon"
weekly_at = "06:30"
weekly_auto_publish_at = "09:00"
max_tasks_per_person_per_day = 5
carry_over_escalation_after = 3
milestone_window_days = 21

[notify]
mail_enabled = true
mail_sender = "itbot@example.be"          # affiché comme expéditeur
mail_sender_id = ""                        # ID d'objet Entra de la boîte itbot (Graph /users/{id}/sendMail)
graph_tenant_id = ""
graph_client_id = ""                       # application « Vigie Mail » (certificat : secret graph_certificate)
teams_enabled = true                       # URL du webhook : secret teams_webhook_url
# proxy = "http://127.0.0.1:3128"          # Squid (phase 8)
draft_only = true                          # rodage : tout part au coordinateur (phase 9)

# Sources : un bloc par connecteur. Champs communs : enabled, interval_min ;
# les autres champs sont validés par le connecteur lui-même.
# Implémentés : zabbix, veeam. Les autres arrivent au fil de la phase 3.
[sources.zabbix]
enabled = true
base_url = "https://zabbix.lan"   # frontend Zabbix (api_jsonrpc.php), pas le serveur MCP
interval_min = 15
min_severity = 2           # 2 = Warning ; les « Information » sont ignorées
aggregate_threshold = 8    # au-delà, les problèmes de sévérité ≤ 3 d'un hôte sont regroupés
proxy_stale_min = 10       # proxy sans contact depuis N minutes → signal « monitoring »
# Mots des groupes d'hôtes → catégorie (remplace les défauts du connecteur si présent) :
# [sources.zabbix.category_by_group]
# "Réseau" = "network"
# "SRV-Veeam" = "backup"

[sources.veeam]
enabled = false
interval_min = 30
base_url = "https://vbr.lan:9419"  # nom porté par le certificat du VBR (pas l'IP, sauf si dans le certificat)
username = "svc-vigie"             # compte local VBR ; mot de passe : secret « veeam_password »
api_version = "1.3-rev1"           # x-api-version : 1.3-rev1 (13.0.1), 1.3-rev2 (13.1) ; voir serverInfo
# ca_bundle = "/etc/vigie/ca/veeam.pem"   # certificat auto-signé du VBR (sinon [tls] ca_bundle)
session_window_days = 7            # historique des sessions lu pour le dernier succès et les échecs consécutifs

[sources.ninjaone]
enabled = false
interval_min = 15
base_url = "https://eu.ninjarmm.com"   # région de l'instance (app, eu, ca, oc, us2)
# client_id = "…"                    # dev seulement ; en prod : secret « ninjaone_client_id » (hors dépôt)
scope = "monitoring"                   # lecture seule ; management jamais demandé
ticket_board_id = 0                    # 0 = tickets non collectés ; id relevé par record_fixtures
ticket_statuses = []                   # ex. ["Nouveau", "Ouvert", "En attente"] (noms affichés)
aggregate_threshold = 5                # au-delà, alertes d'un même type regroupées par société
pending_days = 7                       # patchs en attente (approuvés ou à approuver) : tâche après N jours ; 0 = désactivé
# pending_statuses = ["APPROVED", "MANUAL"]
# pending_os_types = ["SECURITY_UPDATES", "CRITICAL_UPDATES"]
# proxy = "http://127.0.0.1:3128"      # production : sortie Internet par Squid

[sources.defender]
enabled = false
interval_min = 60
tenant_id = "00000000-0000-0000-0000-000000000000"   # tenant Entra (le même que [web])
# client_id = "…"                                     # dev seulement ; prod : secret « defender_client_id »
api_host = "eu.api.security.microsoft.com"           # région UE (api., uk., us. possibles)
certificate = "~/vigie-ca/defender.crt"              # certificat public ; prod : /etc/vigie/ca/defender.crt
private_key_file = "~/vigie-ca/defender.key"         # dev seulement ; prod : secret « defender_private_key »
os_platform_prefixes = ["Windows"]                   # Linux → Wazuh, patchs manquants → NinjaOne
inactive_days = 14                                   # appareils sans remontée depuis plus de N jours
new_days = 14                                        # vulnérabilité « nouvelle » si détectée depuis moins de N jours
max_vulns_per_company = 10                           # par groupe d'appareils, les plus critiques d'abord
min_epss = 0.1                                       # critique retenue si EPSS ≥ ce seuil (ou nouvelle)
# proxy = "http://127.0.0.1:3128"                    # production : sortie Internet par Squid

[sources.fortianalyzer]
enabled = false   # connecteur pas encore implémenté
base_url = "https://faz.lan"
adoms = ["root"]
interval_min = 15

[sources.wazuh]
enabled = false   # connecteur pas encore implémenté
api_url = "https://wazuh.lan:55000"
indexer_url = "https://wazuh.lan:9200"
min_rule_level = 10
interval_min = 15

[sources.veezo]
enabled = false   # produit à identifier

[web]
host = "127.0.0.1"         # derrière Caddy (TLS), jamais exposé directement
port = 8000
session_hours = 8
dev_login = false          # true seulement en dev (exige aussi VIGIE_ENV=dev)
# database_url = "postgresql+psycopg:///vigie?user=vigie_web"   # rôle vigie_web en prod

[web.oidc]
# Application Entra ID (non secret) ; secret client : « entra_client_secret ».
tenant_id = ""
client_id = ""
# ID d'objet des groupes → rôle applicatif (SPEC §2). N'émettre que les groupes assignés (point M).
[web.oidc.groups]
# "00000000-0000-0000-0000-000000000001" = "admin"     # SG-Vigie-Admin
# "00000000-0000-0000-0000-000000000002" = "manager"   # SG-Vigie-Manager
# "00000000-0000-0000-0000-000000000003" = "tech"      # SG-Vigie-Tech
# "00000000-0000-0000-0000-000000000004" = "viewer"    # SG-Vigie-Viewer

[tls]
ca_bundle = "/etc/ssl/certs/internal-ca.pem"
