# Hooks locaux : versions verrouillées par uv.lock, gitleaks par le paquet Debian.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets)
        entry: gitleaks protect --staged --redact --verbose
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types_or: [python, pyi]
